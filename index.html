<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Bố Cục 3 Cột bằng Bootstrap Grid và Flexbox</title>
    <!-- Nhúng Bootstrap 5.3.3 CSS qua CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bước 5: Nhúng Font Awesome 6.5.2 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .carousel-item img {
            height: 420px;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-light">

    <!-- BƯỚC 1: CẤU TRÚC GRID VỚI 3 CỘT KẾT HỢP FLEXBOX CĂN GIỮA -->
    <section class="container mt-5">
        <h3 class="mb-3 text-center text-primary">
            <i class="fas fa-th-large me-2"></i>Bố cục 3 Cột Grid & Flexbox
        </h3>
        <div class="row g-3">
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-4 border rounded shadow-sm">
                <p class="h5 mb-0 fw-bold text-dark">Phần 1</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-secondary p-4 text-white rounded shadow-sm">
                <p class="h5 mb-0 fw-bold">Phần 2</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-4 border rounded shadow-sm">
                <p class="h5 mb-0 fw-bold text-dark">Phần 3</p>
            </div>
        </div>
    </section>

    <!-- BƯỚC 2: ÁP DỤNG MARGIN & PADDING ĐIỀU CHỈNH KHOẢNG CÁCH -->
    <section class="container my-5 py-3 bg-white rounded shadow-sm">
        <h3 class="text-center text-success mb-0">
            <i class="fas fa-arrows-alt-v me-2"></i>Khoảng cách được điều chỉnh bằng Margin &amp; Padding
        </h3>
    </section>

    <!-- BƯỚC 3: SỬ DỤNG DISPLAY PROPERTY ĐỂ HIỂN THỊ / ẨN NỘI DUNG -->
    <div class="container mb-5">
        <div class="d-none d-md-block bg-warning text-dark text-center p-3 rounded fw-semibold shadow-sm">
            <i class="fas fa-desktop me-2"></i>Nội dung này chỉ hiển thị trên màn hình lớn hơn hoặc bằng 768px (Desktop / Tablet ngang)
        </div>
    </div>

    <!-- BƯỚC 4: TẠO CAROUSEL TRÌNH CHIẾU HÌNH ẢNH -->
    <section class="container mt-5">
        <div id="myCarousel" class="carousel slide shadow rounded overflow-hidden" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active" data-bs-interval="4000">
                    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt="Hình ảnh 1">
                </div>
                <div class="carousel-item" data-bs-interval="4000">
                    <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt="Hình ảnh 2">
                </div>
                <div class="carousel-item" data-bs-interval="4000">
                    <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt="Hình ảnh 3">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </section>

    <!-- BƯỚC 5 & 6: TẠO FORM VÀ SỬ DỤNG FONT AWESOME -->
    <section class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card p-4 p-md-5 border-0 shadow-sm bg-white rounded-3">
                    <h3 class="text-center text-primary mb-4 fw-bold">
                        <i class="fas fa-home me-2"></i>Trang chủ - Liên Hệ
                    </h3>

                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Họ và tên</label>
                            <input type="text" class="form-control" id="name" placeholder="Nhập họ và tên" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Nhập email" required>
                        </div>

                        <div class="mb-4">
                            <label for="message" class="form-label fw-semibold">Nội dung</label>
                            <textarea class="form-control" id="message" rows="4" placeholder="Nhập nội dung" required></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg fw-semibold shadow-sm">
                                <i class="fas fa-paper-plane me-2"></i>Gửi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0 small">&copy; 2026 Thực hành Bootstrap Grid &amp; Flexbox Layout.</p>
    </footer>

    <!-- Nhúng JavaScript của Bootstrap 5.3.3 trước thẻ đóng body -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
